<style>
.story-container{margin-top:18px;padding:14px;border:1px solid #303747;border-radius:16px;background:#10161f}
.story-header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.story-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.story-shot{padding:12px;border:1px solid #394151;border-radius:12px;background:#0f141c}
.story-shot strong{display:block;margin-bottom:6px}
.story-meta{font-size:12px;color:#b9c4d9;line-height:1.6}
.story-preview{margin-top:12px;padding:12px;border-radius:10px;background:#0b0e14;border:1px solid #2d394f;color:#d9e3f0;white-space:pre-wrap;font-size:13px;line-height:1.6}
@media(max-width:700px){.story-grid{grid-template-columns:1fr}}
</style>

<section class="card">
  <h2>9. AI 分鏡 / Storyboard</h2>
  <div class="story-container">
    <div class="story-header">
      <div>
        <strong>自動分鏡</strong>
        <div class="muted" style="font-size:12px; margin-top:4px;">依歌詞內容生成鏡頭序列，可接後續圖片生成與影片生產</div>
      </div>
      <button class="secondary" id="generateStoryboardBtn">生成分鏡</button>
    </div>
    <div class="story-grid" id="storyboardList"></div>
    <div class="story-preview" id="storyboardPromptPreview">尚未生成分鏡。</div>
  </div>
</section>

<script type="module">
import { analyzeLyricsToShots, buildShotPrompt, renderStoryboardShots } from './src/modules/storyboard/storyboard-renderer.js';

const makeStoryboard = () => {
  const lyrics = document.getElementById('lyrics').value;
  if (!lyrics.trim()) {
    alert('請先輸入或生成歌詞');
    return;
  }

  const shots = analyzeLyricsToShots(lyrics, { duration: 5 });
  renderStoryboardShots(shots, 'storyboardList');

  const first = shots[0];
  const prompt = buildShotPrompt(first, {
    title: document.getElementById('title').value || 'AI MV',
    style: document.getElementById('style').value || 'cinematic',
    preset: document.getElementById('presetSelect')?.value || 'general-mv',
    ratio: '9:16',
    characterConsistency: true
  });

  document.getElementById('storyboardPromptPreview').textContent = prompt;
  document.getElementById('storyboardPromptPreview').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
};

document.getElementById('generateStoryboardBtn').addEventListener('click', makeStoryboard);

document.getElementById('storyboardList').addEventListener('click', (e) => {
  const generateBtn = e.target.closest('.storyboard-generate');
  const regenerateBtn = e.target.closest('.storyboard-regenerate');
  if (!generateBtn && !regenerateBtn) return;

  const shotId = (generateBtn || regenerateBtn).dataset.shotId;
  const lyrics = document.getElementById('lyrics').value;
  const shots = analyzeLyricsToShots(lyrics, { duration: 5 });
  const shot = shots.find(item => item.id === shotId) || shots[0];

  const prompt = buildShotPrompt(shot, {
    title: document.getElementById('title').value || 'AI MV',
    style: document.getElementById('style').value || 'cinematic',
    preset: document.getElementById('presetSelect')?.value || 'general-mv',
    ratio: '9:16',
    characterConsistency: true
  });

  document.getElementById('storyboardPromptPreview').textContent = prompt;
  alert('已準備此鏡頭的生成 Prompt：\n\n' + prompt);
});
</script>
