<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI 音樂生成工作室</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">AI MUSIC STUDIO</p>
        <h1>AI 音樂生成工作室</h1>
        <p class="sub">輸入歌詞、選曲風與語言，一鍵建立歌曲製作任務。</p>
      </div>
      <span class="badge">Prototype v0.1</span>
    </header>

    <section class="grid">
      <article class="panel">
        <h2>1. 歌詞</h2>
        <label for="title">歌曲名稱</label>
        <input id="title" placeholder="例如：月下琉璃" />

        <label for="lyrics">歌詞</label>
        <textarea id="lyrics" rows="12" placeholder="貼上或輸入你的歌詞…"></textarea>
        <div class="row">
          <button id="demoLyrics" class="secondary">放入示範歌詞</button>
          <button id="clearLyrics" class="ghost">清空</button>
        </div>
      </article>

      <article class="panel">
        <h2>2. 音樂設定</h2>

        <label for="style">曲風</label>
        <select id="style">
          <option>電影級武俠</option>
          <option>台語流行</option>
          <option>史詩搖滾</option>
          <option>電子國風</option>
          <option>抒情古風</option>
          <option>暗黑交響</option>
        </select>

        <label for="language">演唱語言</label>
        <select id="language">
          <option value="zh-tw">繁體中文</option>
          <option value="nan-tw">台語</option>
          <option value="mix">中文＋台語混合</option>
        </select>

        <label for="voice">聲線</label>
        <select id="voice">
          <option>女聲・清亮</option>
          <option>女聲・霸氣</option>
          <option>女聲・低沉</option>
          <option>女聲・戲曲感</option>
        </select>

        <label for="mood">情緒</label>
        <select id="mood">
          <option>氣勢磅礡</option>
          <option>神秘</option>
          <option>悲壯</option>
          <option>熱血</option>
          <option>溫柔</option>
        </select>

        <label for="duration">預計長度</label>
        <select id="duration">
          <option value="60">約 1 分鐘</option>
          <option value="120">約 2 分鐘</option>
          <option value="180">約 3 分鐘</option>
        </select>
      </article>
    </section>

    <section class="panel action-panel">
      <div>
        <h2>3. 生成歌曲</h2>
        <p id="status">目前為介面原型，下一階段會接真正的音樂生成 API。</p>
      </div>
      <button id="generate" class="primary">生成歌曲</button>
    </section>

    <section id="result" class="panel result hidden">
      <h2>製作任務</h2>
      <pre id="resultText"></pre>
      <div class="row">
        <button id="copyPrompt" class="secondary">複製生成提示</button>
        <button id="downloadTask" class="ghost">下載設定 JSON</button>
      </div>
    </section>

    <footer>
      下一步預留：音樂 API、台語 TTS、歌曲歷史、下載 MP3、封面圖生成。
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
