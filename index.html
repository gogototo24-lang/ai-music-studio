<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b10">
<title>AI 音樂生成工作室 v0.3</title>

<style>
*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;
  background:
    radial-gradient(circle at 10% 0%,rgba(105,84,255,.18),transparent 28%),
    radial-gradient(circle at 100% 10%,rgba(0,194,255,.10),transparent 25%),
    #090b10;
  color:#f5f7fb;
}

.wrap{
  max-width:940px;
  margin:auto;
  padding:24px 15px 64px;
}

.top{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:flex-start;
}

.badge,
.pill{
  display:inline-flex;
  align-items:center;
  border:1px solid #3b4559;
  border-radius:999px;
  padding:6px 10px;
  font-size:12px;
  color:#d7dfec;
  background:#121722;
}

.pill.ok{
  border-color:#365f4d;
  color:#b8f2d5;
  background:#102019;
}

h1{
  font-size:clamp(36px,8vw,60px);
  line-height:1.03;
  margin:12px 0 10px;
}

.sub{
  color:#aeb6c7;
  line-height:1.6;
  max-width:760px;
}

.card{
  background:rgba(20,24,33,.96);
  border:1px solid #2d3442;
  border-radius:19px;
  padding:18px;
  margin-top:16px;
}

h2{
  font-size:20px;
  margin:0 0 12px;
}

.step{
  font-size:11px;
  letter-spacing:.14em;
  color:#838da0;
  margin:0 0 6px;
}

.presets{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

label{
  display:block;
  margin:14px 0 6px;
  color:#cbd2df;
  font-size:14px;
}

input,
textarea,
select{
  width:100%;
  background:#0e1118;
  color:#fff;
  border:1px solid #394252;
  border-radius:12px;
  padding:12px;
  font:inherit;
  outline:none;
}

textarea{
  min-height:180px;
  resize:vertical;
}

.small{
  min-height:95px;
}

button{
  border:0;
  border-radius:12px;
  padding:12px 14px;
  font-weight:750;
  cursor:pointer;
  font:inherit;
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.preset{
  background:#202738;
  color:#fff;
  border:1px solid #343e51;
  text-align:left;
}

.primary{
  width:100%;
  background:#fff;
  color:#111;
  margin-top:14px;
  font-size:16px;
}

.secondary{
  background:#2a3040;
  color:#fff;
}

.ghost{
  background:transparent;
  color:#d8deea;
  border:1px solid #394151;
}

.row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:12px;
}

.status{
  border:1px solid #31394a;
  background:#10141c;
  border-radius:14px;
  padding:12px 14px;
  color:#aeb6c7;
  line-height:1.5;
  margin-top:12px;
}

.status.ok{
  border-color:#315942;
  color:#b9efcf;
}

.status.error{
  border-color:#713f48;
  color:#ffc1ca;
}

.hidden{
  display:none!important;
}

pre{
  white-space:pre-wrap;
  word-break:break-word;
  background:#0d1016;
  border:1px solid #333b4a;
  border-radius:12px;
  padding:14px;
  line-height:1.55;
  max-height:420px;
  overflow:auto;
}

.note{
  color:#8f99aa;
  font-size:13px;
  line-height:1.55;
}

.backend{
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
  align-items:end;
}
