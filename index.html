<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0d12">
<title>AI 音樂生成工作室 v0.2</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;
  background:#0b0d12;
  color:#f5f7fb;
}
.wrap{
  max-width:900px;
  margin:auto;
  padding:22px 16px 60px;
}
.badge{
  display:inline-block;
  border:1px solid #465064;
  border-radius:999px;
  padding:6px 10px;
  font-size:12px;
  color:#cfd7e5;
}
h1{
  font-size:38px;
  margin:12px 0 8px;
}
.sub{
  color:#aeb6c7;
  line-height:1.6;
}
.card{
  background:#151922;
  border:1px solid #2e3543;
  border-radius:18px;
  padding:18px;
  margin-top:16px;
}
h2{
  margin:0 0 12px;
  font-size:20px;
}
label{
  display:block;
  margin:14px 0 6px;
  color:#cbd2df;
  font-size:14px;
}
input,textarea,select{
  width:100%;
  background:#0e1118;
  color:#fff;
  border:1px solid #394252;
  border-radius:12px;
  padding:12px;
  font:inherit;
}
textarea{
  min-height:180px;
  resize:vertical;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.presets{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}
button{
  border:0;
  border-radius:12px;
  padding:12px 14px;
  font-weight:700;
  cursor:pointer;
}
.preset{
  background:#222938;
  color:#fff;
  text-align:left;
}
.primary{
  width:100%;
  background:#fff;
  color:#111;
  margin-top:14px;
  font-size:16px;
}
.secondary{
  background:#2a3040;
  color:#fff;
}
.row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:12px;
}
.hidden{display:none}
pre{
  white-space:pre-wrap;
  word-break:break-word;
  background:#0d1016;
  border:1px solid #333b4a;
  border-radius:12px;
  padding:14px;
  line-height:1.55;
}
.note{
  color:#8f99aa;
  font-size:13px;
  line-height:1.5;
}
footer{
  text-align:center;
  color:#70798a;
  font-size:12px;
  margin-top:22px;
}
@media(max-width:650px){
  .grid,.presets{grid-template-columns:1fr}
  h1{font-size:34px}
}
</style>
</head>

<body>

<main class="wrap">

<span class="badge">AI MUSIC STUDIO · v0.2</span>

<h1>AI 音樂生成工作室</h1>

<p class="sub">
輸入歌詞、選擇語言與曲風，建立可以直接拿去音樂 AI 使用的歌曲製作提示。
</p>

<section class="card">
<h2>快速預設</h2>

<div class="presets">
<button class="preset" onclick="preset('maozhang')">
🐾 貓掌江湖・極武篇
</button>

<button class="preset" onclick="preset('taiwanese')">
🎙️ 台語女聲流行
</button>

<button class="preset" onclick="preset('epic')">
⚔️ 電影級史詩武俠
</button>

<button class="preset" onclick="preset('ballad')">
🌙 月夜古風抒情
</button>
</div>
</section>

<section class="card">
<h2>1. 歌曲與歌詞</h2>

<label>歌曲名稱</label>
<input id="title" placeholder="例如：月下琉璃">

<label>歌詞</label>
<textarea id="lyrics" placeholder="在這裡輸入歌詞"></textarea>

<div class="row">
<button class="secondary" onclick="demoLyrics()">
放入示範歌詞
</button>

<button class="secondary" onclick="clearAll()">
清空
</button>
</div>
</section>

<section class="card">
<h2>2. 音樂設定</h2>

<div class="grid">

<div>
<label>曲風</label>
<select id="style">
<option>電影級武俠</option>
<option>台語流行</option>
<option>史詩搖滾</option>
<option>電子國風</option>
<option>抒情古風</option>
<option>暗黑交響</option>
<option>電影配樂</option>
</select>
</div>

<div>
<label>演唱語言</label>
<select id="language">
<option value="繁體中文">繁體中文</option>
<option value="台語">台語</option>
<option value="中文＋台語混合">中文＋台語混合</option>
</select>
</div>

<div>
<label>聲線</label>
<select id="voice">
<option>女聲・清亮</option>
<option>女聲・霸氣</option>
<option>女聲・低沉</option>
<option>女聲・戲曲感</option>
<option>女聲・溫柔</option>
</select>
</div>

<div>
<label>情緒</label>
<select id="mood">
<option>氣勢磅礡</option>
<option>神秘</option>
<option>悲壯</option>
<option>熱血</option>
<option>溫柔</option>
<option>空靈</option>
</select>
</div>

<div>
<label>歌曲長度</label>
<select id="duration">
<option>約 1 分鐘</option>
<option>約 2 分鐘</option>
<option selected>約 3 分鐘</option>
</select>
</div>

<div>
<label>速度</label>
<select id="tempo">
<option>慢板</option>
<option selected>中板</option>
<option>快板</option>
<option>自由速度</option>
</select>
</div>

</div>

<label>額外要求</label>
<textarea id="notes" style="min-height:100px"
placeholder="例如：副歌要有記憶點、適合短影音、前奏不要太長"></textarea>

<button class="primary" onclick="generatePrompt()">
建立歌曲製作任務
</button>

<p id="status" class="note">
目前是 v0.2 前端版本。真正生成歌曲功能下一階段再接 API。
</p>
</section>

<section id="result" class="card hidden">
<h2>3. 歌曲生成提示</h2>

<pre id="output"></pre>

<div class="row">
<button class="secondary" onclick="copyPrompt()">
複製提示詞
</button>

<button class="secondary" onclick="saveProject()">
儲存到手機
</button>
</div>
</section>

<section class="card">
<h2>最近儲存</h2>
<div id="history" class="note">
目前沒有儲存的歌曲。
</div>
</section>

<footer>
AI Music Studio v0.2 · GitHub Pages
</footer>

</main>

<script>

const $ = id => document.getElementById(id);

function preset(type){

const data = {

maozhang:{
title:"極武天命",
style:"電影級武俠",
language:"台語",
voice:"女聲・霸氣",
mood:"氣勢磅礡",
duration:"約 3 分鐘",
tempo:"中板",
notes:"電影級布袋戲武俠氣勢，適合《貓掌江湖・極武篇》，副歌要有強烈記憶點，適合角色登場與武戲剪輯。"
},

taiwanese:{
title:"月下心聲",
style:"台語流行",
language:"台語",
voice:"女聲・溫柔",
mood:"溫柔",
duration:"約 3 分鐘",
tempo:"中板",
notes:"台語女聲自然咬字，旋律順口，副歌明確。"
},

epic:{
title:"天境決",
style:"史詩搖滾",
language:"繁體中文",
voice:"女聲・霸氣",
mood:"熱血",
duration:"約 3 分鐘",
tempo:"快板",
notes:"大鼓、弦樂、東方元素，電影預告級氣勢。"
},

ballad:{
title:"月下琉璃",
style:"抒情古風",
language:"繁體中文",
voice:"女聲・清亮",
mood:"空靈",
duration:"約 3 分鐘",
tempo:"慢板",
notes:"古風、月夜、琉璃、孤城意象，旋律清楚而有留白。"
}

}[type];

$("title").value = data.title;
$("style").value = data.style;
$("language").value = data.language;
$("voice").value = data.voice;
$("mood").value = data.mood;
$("duration").value = data.duration;
$("tempo").value = data.tempo;
$("notes").value = data.notes;

$("status").textContent =
"已套用預設，可以開始填歌詞。";

}

function demoLyrics(){

$("title").value =
$("title").value || "月下琉璃";

$("lyrics").value =
`月落琉璃映孤城，
風過長夜問前程。
一扇清光開劍境，
半生霜雪化星辰。

若問此身何處去，
且將孤影寄長風。
月華照盡千山雪，
一念琉璃破夜空。`;

}

function clearAll(){

$("title").value = "";
$("lyrics").value = "";
$("notes").value = "";

}

function generatePrompt(){

const title =
$("title").value.trim() || "未命名歌曲";

const lyrics =
$("lyrics").value.trim();

if(!lyrics){

$("status").textContent =
"請先輸入歌詞。";

return;

}

const prompt =
`【歌曲名稱】
${title}

【曲風】
${$("style").value}

【語言】
${$("language").value}

【聲線】
${$("voice").value}

【情緒】
${$("mood").value}

【速度】
${$("tempo").value}

【歌曲長度】
${$("duration").value}

【額外要求】
${$("notes").value || "無"}

【製作方向】
主歌、副歌層次清楚。
旋律要有記憶點。
人聲歌詞要清楚。
適合短影音時，前 8–12 秒要有吸引力。

【歌詞】
${lyrics}`;

$("output").textContent = prompt;

$("result").classList.remove("hidden");

window.currentPrompt = prompt;

$("status").textContent =
"歌曲製作任務已建立。";

$("result").scrollIntoView({
behavior:"smooth"
});

}

async function copyPrompt(){

if(!window.currentPrompt) return;

try{

await navigator.clipboard.writeText(
window.currentPrompt
);

alert("已複製提示詞");

}catch{

alert("無法自動複製，請手動選取文字");

}

}

function saveProject(){

const project = {
title:$("title").value,
style:$("style").value,
language:$("language").value,
voice:$("voice").value,
mood:$("mood").value,
tempo:$("tempo").value,
duration:$("duration").value,
notes:$("notes").value,
lyrics:$("lyrics").value
};

let history = [];

try{
history =
JSON.parse(
localStorage.getItem("musicProjects")
) || [];
}catch{}

history.unshift(project);

history =
history.slice(0,5);

localStorage.setItem(
"musicProjects",
JSON.stringify(history)
);

renderHistory();

alert("已儲存到這台裝置");

}

function renderHistory(){

let history = [];

try{
history =
JSON.parse(
localStorage.getItem("musicProjects")
) || [];
}catch{}

if(!history.length){

$("history").innerHTML =
"目前沒有儲存的歌曲。";

return;

}

$("history").innerHTML =
history.map((item,index)=>`
<div style="
padding:10px 0;
border-bottom:1px solid #2e3543">
<strong>${item.title || "未命名歌曲"}</strong>
<br>
<span>
${item.style} · ${item.language}
</span>
<br>
<button
style="margin-top:8px;background:#2a3040;color:white"
onclick="loadProject(${index})">
載入
</button>
</div>
`).join("");

}

function loadProject(index){

const history =
JSON.parse(
localStorage.getItem("musicProjects")
) || [];

const p =
history[index];

if(!p) return;

$("title").value = p.title || "";
$("style").value = p.style;
$("language").value = p.language;
$("voice").value = p.voice;
$("mood").value = p.mood;
$("tempo").value = p.tempo;
$("duration").value = p.duration;
$("notes").value = p.notes || "";
$("lyrics").value = p.lyrics || "";

window.scrollTo({
top:0,
behavior:"smooth"
});

}

renderHistory();

</script>

</body>
</html>
<!-- rebuild -->
